# ============================================================================
# Deployment configuration — commit this file.
#
# The pipeline (validate + build + deploy) and `make deploy` read it for all
# NON-sensitive settings: ports, replicas, ingress, resources, extra env ...
#
# Anything sensitive stays in GitLab CI/CD variables and is never put here:
#   - NEXUS_URL / NEXUS_USERNAME / NEXUS_API_KEY
#   - KUBE_CONFIG_CONTENT / KUBE_CONTEXT
#   - the VALUES of every name listed in SECRETS below (Masked + Protected)
#
# Precedence: values already set in the environment / CI/CD variables ALWAYS
# win over this file. Regenerate this file any time with:  make configure
# ============================================================================

APP_NAME=myapp            # required; also your k8s resource names
NAMESPACE=myapp           # defaults to APP_NAME
ENVIRONMENT=production    # production, staging, dev, ...
IMAGE=myapp:latest        # in CI this is set automatically from Nexus

REPLICAS=2                # how many copies of your app run
APP_PORT=3000             # port your app listens on inside the container
SERVICE_PORT=80           # port the Service exposes
SERVICE_TYPE=ClusterIP    # ClusterIP | NodePort | LoadBalancer
NODE_PORT=                # fixed port when NodePort (30000-32767), empty = auto

# Only if you want a public domain (otherwise leave empty):
INGRESS_HOST=
INGRESS_CLASS=nginx
INGRESS_PATH=/

HEALTHCHECK_PATH=/health  # path that returns success when the app is healthy

MEMORY_REQUEST=128Mi
CPU_REQUEST=100m
MEMORY_LIMIT=256Mi
CPU_LIMIT=500m

# Extra environment variables passed to your app, comma-separated:
# EXTRA_ENV=API_URL=https://x,LOG_LEVEL=debug
EXTRA_ENV=

# Secret variable NAMES only (never values!). The VALUES come from GitLab
# CI/CD variables (Masked + Protected) with the same names:
# SECRETS=DB_PASSWORD,API_KEY
SECRETS=

# Pulling the image from a private registry (e.g. Nexus):
# IMAGE_PULL_SECRETS=regcred        # k8s secret name(s) to attach to the pod
