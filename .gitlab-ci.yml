image: docker:24
services:
  - docker:24-dind

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

# IMPORTANT: keep this block empty. Anything defined here would OVERRIDE the
# same-named variables in your GitLab project settings. Your config lives in
# .env (generated by `make configure`) and in GitLab CI/CD variables.
#
# Required project variable:  APP_NAME
# Optional: INGRESS_HOST (if you expose a domain), KUBE_CONFIG_CONTENT
# (base64 kubeconfig for an external cluster), KUBE_CONTEXT, and any of the
# values in .env.example (REPLICAS, APP_PORT, MEMORY_LIMIT, ...).

stages:
  - validate
  - build
  - deploy

# -------- VALIDATE --------
# Fast feedback: checks your configuration before spending time building.
validate:
  stage: validate
  image: python:3.12-slim
  script:
    - python3 scripts/configure.py --check
  only:
    - main
  tags:
    - bankai

# -------- BUILD --------
build:
  stage: build
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    # Build context: use the repo root if it has a Dockerfile, else app/
    - if [ -f Dockerfile ]; then CONTEXT="."; else CONTEXT="./app"; fi
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CONTEXT"
    - docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  only:
    - main
  tags:
    - bankai

# -------- DEPLOY --------
# Uses the same deploy script as local `make deploy`, so CI and local behave
# identically. The image tag is derived automatically from the registry vars.
deploy:
  stage: deploy
  image: python:3.12-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates
    # Install kubectl (only tool deploy.py needs)
    - curl -fsSLO "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    - chmod +x kubectl && mv kubectl /usr/local/bin/kubectl
    # Point kubectl at your cluster: either GitLab Kubernetes integration
    # (sets KUBE_CONFIG_CONTENT) or a base64 kubeconfig variable
    - if [ -n "$KUBE_CONFIG_CONTENT" ]; then mkdir -p "$HOME/.kube" && echo "$KUBE_CONFIG_CONTENT" | base64 -d > "$HOME/.kube/config"; fi
    - if [ -n "$KUBE_CONTEXT" ]; then kubectl config use-context "$KUBE_CONTEXT"; fi
  script:
    - python3 scripts/deploy.py --yes
  only:
    - main
  tags:
    - bankai
