image: docker:24
services:
  - docker:24-dind
  # If your Nexus registry is plain HTTP (no TLS), uncomment and put the
  # registry host:port below so the Docker daemon trusts it:
  # - name: docker:24-dind
  #   command: ["--insecure-registry", "nexus.example.com:8082"]

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

# ============ GitLab CI/CD project variables ============
#   APP_NAME          (required)        your app name
#   NEXUS_URL         (required)        Nexus docker registry host:port, no
#                                       scheme, e.g. nexus.example.com:8082
#   NEXUS_USERNAME    (required)        Nexus user
#   NEXUS_API_KEY     (required)        Nexus API key / password
#   NEXUS_DOCKER_REPO (optional)        repository on Nexus, default
#                                       docker-releases (can include a path
#                                       prefix, e.g. sde4-releases/backend)
#   INGRESS_HOST, KUBE_CONFIG_CONTENT, KUBE_CONTEXT, secrets, ...
#   IMAGE_PULL_SECRETS (optional)       comma-separated k8s imagePullSecret
#                                       names, e.g. regcred
#
# IMPORTANT: keep the variables: block above minimal — anything defined here
# would OVERRIDE the same-named variables in your project settings.

stages:
  - validate
  - build
  - deploy

# -------- VALIDATE --------
# Fast feedback: checks your configuration before spending time building.
validate:
  stage: validate
  image: python:3.12-slim
  script:
    - python3 scripts/configure.py --check
  only:
    - main
  tags:
    - docker-runner

# -------- BUILD + PUBLISH TO NEXUS --------
build:
  stage: build
  script:
    # Fail fast with helpful messages instead of cryptic docker errors
    - |
      if [ ! -f "$NEXUS_URL" ]; then
        echo "ERROR: NEXUS_URL is not set (GitLab CI/CD variable)"
        exit 1
      fi
      if [ ! -f "$NEXUS_USERNAME" ]; then
        echo "ERROR: NEXUS_USERNAME is not set (GitLab CI/CD variable)"
        exit 1
      fi
      if [ ! -f "$NEXUS_API_KEY" ]; then
        echo "ERROR: NEXUS_API_KEY is not set (GitLab CI/CD variable)"
        exit 1
      fi

    # Build context: use the repo root if it has a Dockerfile, else app/
    - if [ -f Dockerfile ]; then CONTEXT="."; else CONTEXT="./app"; fi
    - IMAGE="$NEXUS_URL/repository/${NEXUS_DOCKER_REPO:-docker-releases}/$APP_NAME"
    - docker build -t "$IMAGE:$CI_COMMIT_SHORT_SHA" "$CONTEXT"
    - echo "$NEXUS_API_KEY" | docker login --username "$NEXUS_USERNAME" --password-stdin "$NEXUS_URL"
    - docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker tag "$IMAGE:$CI_COMMIT_SHORT_SHA" "$IMAGE:latest"
    - docker push "$IMAGE:latest"
  only:
    - main
  tags:
    - docker-runner

# -------- DEPLOY --------
# Uses the same deploy script as local `make deploy`, so CI and local behave
# identically. The image tag is pinned to the commit that was just built.
deploy:
  stage: deploy
  image: python:3.12-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates
    # Install kubectl (only tool deploy.py needs)
    - curl -fsSLO "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    - chmod +x kubectl && mv kubectl /usr/local/bin/kubectl
    # Point kubectl at your cluster: either GitLab Kubernetes integration
    # (sets KUBE_CONFIG_CONTENT) or a base64 kubeconfig variable
    - if [ -n "$KUBE_CONFIG_CONTENT" ]; then mkdir -p "$HOME/.kube" && echo "$KUBE_CONFIG_CONTENT" | base64 -d > "$HOME/.kube/config"; fi
    - if [ -n "$KUBE_CONTEXT" ]; then kubectl config use-context "$KUBE_CONTEXT"; fi
  script:
    - export IMAGE="$NEXUS_URL/repository/${NEXUS_DOCKER_REPO:-docker-releases}/$APP_NAME:$CI_COMMIT_SHORT_SHA"
    - python3 scripts/deploy.py --yes
  only:
    - main
  tags:
    - docker-runner
