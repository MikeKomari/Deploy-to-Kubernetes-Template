image: docker:24

services:
  - docker:24-dind

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  # ---- Customize these in GitLab CI/CD variables ----
  APP_NAME:          ""
  ENVIRONMENT:       "production"
  REPLICAS:          "2"
  APP_PORT:          "3000"
  SERVICE_PORT:      "80"
  SERVICE_TYPE:      "ClusterIP"
  INGRESS_HOST:      ""
  INGRESS_CLASS:     "nginx"
  INGRESS_PATH:      "/"
  HEALTHCHECK_PATH:  "/health"
  MEMORY_REQUEST:    "128Mi"
  CPU_REQUEST:       "100m"
  MEMORY_LIMIT:      "256Mi"
  CPU_LIMIT:         "500m"

stages:
  - build
  - deploy

# -------- BUILD --------
build:
  stage: build
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  only:
    - main

# -------- DEPLOY --------
deploy:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    # Create namespace first (if it exists as a file)
    - if [ -f k8s/namespace.yaml ]; then envsubst < k8s/namespace.yaml | kubectl apply -f -; fi
    # Apply all other manifests (namespace.yaml skipped on second pass)
    - for f in k8s/*.yaml; do
        [ -f "$$f" ] || continue;
        name="$$(basename $$f)";
        [ "$$name" = "namespace.yaml" ] && continue;
        case "$$name" in kustomization.yaml) continue;; esac;
        envsubst < "$$f" | kubectl apply -f -;
      done
  only:
    - main
