image: docker:24

services:
  - docker:24-dind

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  # ---- Customize these in GitLab CI/CD variables or here ----
  APP_NAME:          "simple-backend"
  ENVIRONMENT:       "production"
  REPLICAS:          "2"
  APP_PORT:          "3000"
  SERVICE_PORT:      "80"
  SERVICE_TYPE:      "ClusterIP"
  INGRESS_HOST:      "simple-backend.example.com"
  INGRESS_CLASS:     "nginx"
  INGRESS_PATH:      "/"
  HEALTHCHECK_PATH:  "/health"
  MEMORY_REQUEST:    "128Mi"
  CPU_REQUEST:       "100m"
  MEMORY_LIMIT:      "256Mi"
  CPU_LIMIT:         "500m"

stages:
  - build
  - deploy

# -------- BUILD --------
build:
  stage: build
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" ./app
    - docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  only:
    - main

# -------- DEPLOY --------
deploy:
  stage: deploy
  image: python:3.13-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl ca-certificates
    - KUBECTL_VERSION=$(curl -sL https://dl.k8s.io/release/stable.txt)
    - curl -sLo /usr/local/bin/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
    - chmod +x /usr/local/bin/kubectl
  script:
    # If KUBE_CONTEXT (base64 kubeconfig) is set as a CI/CD variable, use it.
    # Otherwise the GitLab Kubernetes integration must pre-authenticate the job.
    - if [ -n "$KUBE_CONTEXT" ]; then echo "$KUBE_CONTEXT" | base64 -d > /tmp/kubeconfig && export KUBECONFIG=/tmp/kubeconfig; fi
    - python3 scripts/deploy.py
  only:
    - main
